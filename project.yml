name: TechProsCustomer
options:
  bundleIdPrefix: com.techpros
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.techpros.customer
    INFOPLIST_FILE: TechProsCustomer/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.46.0

targets:
  TechProsCustomer:
    type: application
    platform: iOS
    sources:
      - TechProsCustomer
    resources:
      - TechProsCustomer/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techpros.customer
        INFOPLIST_FILE: TechProsCustomer/Resources/Info.plist
        DEVELOPMENT_TEAM: CX6M8MBXJ9
        CODE_SIGN_STYLE: Automatic
